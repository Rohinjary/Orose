<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layouts/default}">

<head>
  <title>Dashboard</title>
  <th:block layout:fragment="page-styles">
    <link href="/css/dashboard.css" rel="stylesheet" />
  </th:block>
</head>

<body>


  <div layout:fragment="content">
    <!-- PAGE: DASHBOARD -->
    <div class="page active" id="pg-dashboard"
      style="display: flex; flex-direction: column; height: calc(100vh - var(--topbar-h) - 40px); overflow: hidden;">

      <!-- BANNER & CONTROLS -->
      <div class="dash-banner" style="padding: 16px 24px; margin-bottom: 16px; flex-shrink: 0;">
        <div>
          <h2 class="banner-title" style="font-size: 18px;">Bienvenue <span sec:authentication="name"></span></h2>
          <p class="banner-sub" style="font-size: 12px;"> <span th:text="${date}"></span></p>
        </div>

        <!-- BOUTONS DE COMMUTATION DE VUE -->
        <div class="view-switcher">
          <button class="btn-switch active" onclick="switchView('elevage', this)">
            <i class="bi bi-water"></i> Élevage &amp; Bassins
          </button>
          <button class="btn-switch" onclick="switchView('production', this)">
            <i class="bi bi-bar-chart"></i> Production &amp; Stocks
          </button>
        </div>
      </div>

      <!-- CONTENEUR PRINCIPAL DES VUES (Prend tout l'espace restant) -->
      <div class="view-container" style="flex: 1; position: relative; min-height: 0;">

        <!-- ================= VUE 1 : ELEVAGE & BASSINS ================= -->
        <div id="view-elevage" class="dashboard-view active">
          <div class="card" style="height: 100%; margin-bottom: 0; display: flex; flex-direction: column;">
            <div class="card-header" style="margin-bottom: 12px; flex-shrink: 0;">
              <h3 class="card-title">État détaillé des bassins actifs</h3>
            </div>

            <!-- Grid scrollable uniquement à l'intérieur si trop de bassins, sans scroller l'écran -->
            <div style="flex: 1; overflow-y: auto; min-height: 0; padding-right: 4px;">
              <div class="bassin-grid" th:if="${not #lists.isEmpty(bassinsActifs)}">
                <div class="bassin-card" th:each="bassin : ${bassinsActifs}">
                  <div class="bassin-id">Bassin <span th:text="${bassin.code}"></span> <span
                      class="badge badge-success">Actif</span></div>
                  <div class="bassin-stat-row"><span>Cycle : Semaine <span
                        th:text="${bassin.semaineActuelle}">8</span></span><span
                      th:text="${#numbers.formatDecimal(bassin.avancement, 1, 0) + '%'}"></span></div>
                  <div class="progress-container">
                    <div class="progress-bar" th:style="'width:' + ${bassin.avancement} + '%'"></div>
                  </div>
                  <div class="bassin-stat-row"><span>Restant : <span th:text="${bassin.joursRestants}"></span>
                      jours</span></div>
                  <div class="bassin-stat-row" style="margin-top: 8px;"><span>Poids moyen</span><span
                      style="font-weight:700"
                      th:text="${#numbers.formatDecimal(bassin.poidsMoyen, 1, 1) + ' g'}"></span></div>
                </div>
              </div>
              <div th:if="${#lists.isEmpty(bassinsActifs)}"
                style="padding: 24px; text-align: center; color: #6b7280; font-style: italic;">
                Il n'y a pas de bassins actifs pour le moment.
              </div>
            </div>
          </div>
        </div>

        <!-- ================= VUE 2 : PRODUCTION & STOCKS ================= -->
        <div id="view-production" class="dashboard-view">
          <div style="display: flex; flex-direction: column; gap: 16px; height: 100%;">

            <!-- TOP KPI GRID -->
            <div class="kpi-grid" style="margin-bottom: 0; flex-shrink: 0;">
              <div class="kpi-card" style="grid-column: span 2; position: relative; padding: 12px 16px;">
                <div style="position: absolute; right: 16px; top: 12px;">
                  <form onsubmit="return false;">
                    <select name="annee" id="annee" onchange="changerAnnee()"
                      style="padding: 2px 6px; border-radius: 6px; border: 1px solid var(--mg-outline); font-family: inherit; font-size: 12px;">
                      <option value="2026" th:selected="${annee == 2026}">2026</option>
                      <option value="2025" th:selected="${annee == 2025}">2025</option>
                      <option value="2024" th:selected="${annee == 2024}">2024</option>
                    </select>
                  </form>
                </div>
                <div class="kpi-label">Production annuelle</div>
                <div class="kpi-value" style="font-size: 20px;"><span id="prodAnnuelle"></span> kg </div>
                <div class="kpi-sub">Objectif : <span id="objectifAnnuel"></span></div>
              </div>

              <div class="kpi-card" style="padding: 12px 16px;">
                <div class="kpi-label">Stock crevettes</div>
                <div class="kpi-value" style="font-size: 20px;"> <span
                    th:text="${situationStock.stockCrevetteKg}"></span> kg</div>
                <div class="kpi-sub">Valeur : <span th:text="${situationStock.valeurCrevetteAr}"></span> Ar</div>
              </div>

              <div class="kpi-card" style="padding: 12px 16px;">
                <div class="kpi-label">Stock aliments</div>
                <div class="kpi-value" style="font-size: 20px;"> <span
                    th:text="${situationStock.stockAlimentKg}"></span> kg</div>
                <div class="kpi-sub">Autonomie: <span th:text="${situationStock.autonomieAlimentJours}"></span> jours
                </div>
              </div>
            </div>

            <!-- CHART CARD -->
            <div class="card"
              style="flex: 1; margin-bottom: 0; padding: 16px; display: flex; flex-direction: column; min-height: 0;">
              <div class="card-header" style="margin-bottom: 8px; flex-shrink: 0;">
                <h3 class="card-title">Vue de la production annuelle</h3>
              </div>
              <div style="flex: 1; position: relative; min-height: 0; width: 100%;">
                <!-- Canvas for Chart.js forced to fit container -->
                <canvas id="salesChart"
                  style="position: absolute; left: 0; top: 0; width: 100%; height: 100%;"></canvas>
              </div>
            </div>

          </div>
        </div>

      </div>
    </div>

    <!-- Script JS Chart et Switcher -->
    <script src="/js/chart.js"></script>
    <script th:inline="javascript">
      const ctx = document.getElementById('salesChart');
      let dataset = [];

      const chart = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: ['Janvier', 'Février', 'Mars', 'Avril', 'Mai', 'Juin', 'Juillet', 'Août', 'Septembre', 'Octobre', 'Novembre', 'Décembre'],
          datasets: [{
            label: 'Crevettes (kg)',
            data: dataset,
            backgroundColor: ['#3498db'],
            borderWidth: 1
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false, // Important pour forcer le graphique à respecter la taille CSS
          plugins: {
            legend: { display: true }
          },
          scales: {
            y: { beginAtZero: true }
          }
        }
      });

      async function changerAnnee() {
        try {
          const annee = document.getElementById("annee").value;
          const response = await fetch("/api/production-stats?annee=" + annee);
          if (!response.ok) throw new Error("Erreur serveur");
          const data = await response.json();

          const objVal = data.objectifAnnuel;
          chart.data.datasets[0].data = data.mensuelle;
          chart.update();

          const kpiValeur = data.annuelle;
          let pourcentage = "0.0";
          if (kpiValeur > 0 && objVal > 0) {
            pourcentage = ((kpiValeur / objVal) * 100).toFixed(1);
          }

          if (!kpiValeur) {
            document.getElementById('prodAnnuelle').innerText = "Pas de données";
          } else {
            document.getElementById('prodAnnuelle').innerText = kpiValeur;
          }

          document.getElementById('objectifAnnuel').innerHTML = objVal + " kg (<span style='color: var(--mg-success); font-weight: bold;'>" + pourcentage + "%</span>)";
        } catch (error) {
          console.error(error);
          document.getElementById('prodAnnuelle').innerText = "Pas de données";
        }
      }

      // Fonction Javascript pour changer de vue
      function switchView(viewName, element) {
        // Enlever la classe active de tous les boutons et vues
        document.querySelectorAll('.btn-switch').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.dashboard-view').forEach(view => view.classList.remove('active'));

        // Activer les éléments cibles
        element.classList.add('active');
        document.getElementById('view-' + viewName).classList.add('active');

        // Redessiner le graphique si on va sur la vue production pour éviter les bugs de dimension
        if (viewName === 'production') {
          setTimeout(() => { chart.resize(); chart.update(); }, 50);
        }
      }

      document.addEventListener("DOMContentLoaded", function () {
        changerAnnee();
      });
    </script>
  </div>
</body>

</html>
