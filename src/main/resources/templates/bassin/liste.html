<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
    layout:decorate="~{layouts/default}">

<head>
    <title layout:fragment="page-title">Move Gasy — Liste des Bassins</title>
    <th:block layout:fragment="page-styles">
        <link href="/css/bassin/liste.css" rel="stylesheet" />
    </th:block>
</head>

<body>

    <div layout:fragment="content">

        <div class="page-header">
            <h1 class="section-title" style="font-size: 22px;">Gestion des Bassins</h1>

            <div class="action-group">
                <a class="btn-mg btn-mg-secondary" th:href="@{/bassins/liste/export(format='excel')}"><i class="bi bi-file-earmark-excel"></i> Excel</a>
                <a class="btn-mg btn-mg-secondary" th:href="@{/bassins/liste/export(format='pdf')}"><i class="bi bi-file-earmark-pdf"></i> PDF</a>
                <a class="btn-mg btn-mg-secondary" th:href="@{/bassins/liste/export(format='csv')}"><i class="bi bi-filetype-csv"></i> CSV</a>
                <a th:href="@{/bassins/nouveau}" class="btn-mg btn-mg-primary" sec:authorize="hasRole('ADMIN')">
                    <i class="bi bi-plus-lg"></i> Nouveau bassin
                </a>
            </div>
        </div>

        <div th:if="${erreur}" class="alert alert-danger" style="
            background:#fee2e2;
            color:#991b1b;
            border:1px solid #fca5a5;
            padding:12px;
            margin-bottom:20px;
            border-radius:6px;">
            <span th:text="${erreur}"></span>
        </div>

        <!-- ── Barre de filtres ──────────────────────────────────────────────── -->
        <section class="filters-section">
            <div class="filter-group">
                <label class="filter-label" for="filter-etat">État</label>
                <select id="filter-etat" class="filter-input">
                    <option value="">Tous les états</option>
                    <option value="VIDE">Vide</option>
                    <option value="PREPARATION">Préparation</option>
                    <option value="ACTIF">Actif</option>
                    <option value="EN_TRAITEMENT">En traitement</option>
                    <option value="RECOLTE">Récolté</option>
                    <option value="QUARANTAINE">Quarantaine</option>
                </select>
            </div>

            <div class="filter-group">
                <label class="filter-label" for="filter-disponibilite">Disponibilité</label>
                <select id="filter-disponibilite" class="filter-input">
                    <option value="">Tous</option>
                    <option value="LIBRE">Libre (sans cycle actif)</option>
                    <option value="OCCUPE">Occupé (cycle actif)</option>
                </select>
            </div>

            <div class="filter-group" style="flex: 1; min-width: 220px;">
                <label class="filter-label" for="filter-cycle">Cycle actif</label>
                <input type="text" id="filter-cycle" class="filter-input" placeholder="Rechercher un code de cycle..." />
            </div>

            <button type="button" id="btn-reset-filters" class="btn-mg btn-mg-secondary btn-reset-filters">
                <i class="bi bi-x-circle"></i> Réinitialiser
            </button>
        </section>

        <div id="row-count"></div>

        <!-- ── Grille de cartes ──────────────────────────────────────────────── -->
        <div class="bassin-grid" id="bassin-grid">

            <div th:if="${#lists.isEmpty(bassins)}" class="empty-state" id="empty-server">
                <i class="bi bi-droplet-half"></i>
                <p>Aucun bassin enregistré pour le moment.</p>
            </div>

            <article th:each="bassin : ${bassins}"
                     th:with="suivi=${suivisParBassin.get(bassin.id)}"
                     class="bassin-card"
                     th:attr="data-code=${bassin.code},
                              data-statut=${bassin.statutActuel.code},
                              data-disponibilite=${suivi != null ? 'OCCUPE' : 'LIBRE'},
                              data-cycle=${suivi != null ? suivi.codeUniqueCycle : ''}">

                <div class="bassin-id">
                    <span th:text="'Bassin ' + ${bassin.code}">Bassin B01</span>
                    <span class="badge-statut"
                        th:classappend="${bassin.statutActuel.code == 'ACTIF'} ? 'badge-actif' :
                            (${bassin.statutActuel.code == 'PREPARATION'} ? 'badge-preparation' :
                            (${bassin.statutActuel.code == 'EN_TRAITEMENT'} ? 'badge-traitement' :
                            (${bassin.statutActuel.code == 'QUARANTAINE'} ? 'badge-quarantaine' :
                            (${bassin.statutActuel.code == 'RECOLTE'} ? 'badge-recolte' : 'badge-vide'))))"
                        th:text="${bassin.statutActuel.libelle}">Actif</span>
                </div>

                <div class="bassin-stat-row">
                    <span th:text="${suivi != null} ? ('Semaine ' + ${suivi.semaine}) :
                                    (${bassin.statutActuel.code == 'VIDE'} ? 'Disponible' : ${bassin.statutActuel.libelle})">—</span>
                    <span th:text="${suivi != null and suivi.tauxAvancement != null} ? ${suivi.tauxAvancement} + '%' : ''"></span>
                </div>

                <div class="progress-container">
                    <div class="progress-bar"
                         th:style="'width:' + ${suivi != null and suivi.tauxAvancement != null ? suivi.tauxAvancement : 0} + '%'"></div>
                </div>

                <div class="bassin-stat-row" style="margin-bottom:0;">
                    <span th:if="${suivi != null and suivi.recolteProche}" class="harvest-alert">
                        <i class="bi bi-lightning-charge-fill"></i> Récolte proche
                    </span>
                    <span th:unless="${suivi != null and suivi.recolteProche}" class="footer-label"
                          th:text="'Cycle: ' + (${suivi != null} ? ${suivi.codeUniqueCycle} : '—')">Cycle: —</span>
                    <span th:if="${suivi != null and suivi.poidsMoyenActuel != null}" style="font-weight:700; color: var(--mg-primary);"
                          th:text="'Poids: ' + ${suivi.poidsMoyenActuel} + ' g'"></span>
                </div>

                <div class="bassin-footer">
                    <div class="footer-stat">
                        <span class="footer-label">Restant</span>
                        <span class="footer-val"
                              th:text="${suivi != null and suivi.joursRestants != null} ? (${suivi.joursRestants} + ' jrs') : '—'">—</span>
                    </div>
                    <a th:href="@{/bassins/{id}(id=${bassin.id})}" class="btn-card">
                        <i class="bi bi-eye"></i> Détails
                    </a>
                </div>
            </article>

            <div id="empty-filtered" style="display:none;" class="empty-state">
                <i class="bi bi-search"></i>
                <p>Aucun bassin ne correspond aux critères de recherche.</p>
            </div>
        </div>

    </div>

    <th:block layout:fragment="page-scripts">
        <script th:src="@{/js/bassin/liste-filtres.js}"></script>
    </th:block>
</body>

</html>
