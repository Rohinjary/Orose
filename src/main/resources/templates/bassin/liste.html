<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
    layout:decorate="~{layouts/default}">

<head>
    <title layout:fragment="page-title">Move Gasy — Liste des Bassins</title>
    <th:block layout:fragment="page-styles">
        <link href="/css/bassin/liste.css" rel="stylesheet" />
        <style>
            .status-badge {
                display: inline-block;
                padding: 4px 8px;
                border-radius: 4px;
                font-size: 12px;
                font-weight: 600;
                text-transform: uppercase;
                white-space: nowrap;
            }
            .badge-vide         { background: #f1f5f9; color: #475569; }
            .badge-preparation  { background: #fef9c3; color: #854d0e; }
            .badge-actif        { background: #dcfce7; color: #166534; }
            .badge-quarantaine  { background: #fee2e2; color: #991b1b; }
            .badge-traitement   { background: #e0f2fe; color: #075985; }
            .badge-recolte      { background: #f3e8ff; color: #6b21a8; }
            .badge-inactif      { background: #e5e7eb; color: #374151; }

            .filters-bar {
                display: flex;
                gap: 12px;
                align-items: end;
                flex-wrap: wrap;
                margin-bottom: 16px;
            }
            .filter-group {
                display: flex;
                flex-direction: column;
                gap: 4px;
            }
            .filter-label {
                font-size: 11px;
                font-weight: 600;
                text-transform: uppercase;
                color: var(--mg-text-muted);
                letter-spacing: 0.03em;
            }
            .filter-input, .filter-select {
                padding: 8px 12px;
                border: 1px solid var(--mg-outline);
                border-radius: var(--radius);
                font-size: 13px;
                background: white;
                color: var(--mg-primary);
                outline: none;
            }
            .filter-select { cursor: pointer; }
            .btn-reset-filters {
                font-size: 13px;
                padding: 8px 12px;
            }
            th.sortable { cursor: pointer; user-select: none; }
            th.sortable .sort-icon { font-size: 11px; opacity: 0.5; margin-left: 4px; }
            th.sortable.sort-asc .sort-icon::before { content: "\f149"; opacity: 1; }
            th.sortable.sort-desc .sort-icon::before { content: "\f14b"; opacity: 1; }
            #row-count { font-size: 13px; color: var(--mg-text-muted); margin-bottom: 8px; }
        </style>
    </th:block>
</head>

<body>

    <div layout:fragment="content">

        <div class="page-header">
            <h1 class="section-title" style="font-size: 22px;">Bassins de Production</h1>

            <div class="action-group">
                <a class="btn-mg btn-mg-secondary" th:href="@{/bassins/liste/export(format='excel')}"><i class="bi bi-file-earmark-excel"></i> Excel</a>
                <a class="btn-mg btn-mg-secondary" th:href="@{/bassins/liste/export(format='pdf')}"><i class="bi bi-file-earmark-pdf"></i> PDF</a>
                <a class="btn-mg btn-mg-secondary" th:href="@{/bassins/liste/export(format='csv')}"><i class="bi bi-filetype-csv"></i> CSV</a>
                <a th:href="@{/bassins/nouveau}" class="btn-mg btn-mg-primary" sec:authorize="hasRole('ADMIN')">
                    <i class="bi bi-plus-lg"></i> Nouveau bassin
                </a>
            </div>
        </div>

        <div th:if="${erreur}" class="alert alert-danger" style="
            background:#fee2e2;
            color:#991b1b;
            border:1px solid #fca5a5;
            padding:12px;
            margin-bottom:20px;
            border-radius:6px;">
            <span th:text="${erreur}"></span>
        </div>

        <!-- Barre de recherche multicritère + filtre par colonne -->
        <div class="filters-bar">
            <div class="filter-group" style="flex: 1; min-width: 220px;">
                <label class="filter-label" for="search-global">Recherche (code, surface, profondeur)</label>
                <input type="text" id="search-global" class="filter-input" placeholder="Rechercher un bassin..." />
            </div>

            <div class="filter-group">
                <label class="filter-label" for="filter-statut">Statut</label>
                <select id="filter-statut" class="filter-select">
                    <option value="">-- Tous --</option>
                    <option value="VIDE">Vide</option>
                    <option value="PREPARATION">Préparation</option>
                    <option value="ACTIF">Actif</option>
                    <option value="EN_TRAITEMENT">En traitement</option>
                    <option value="RECOLTE">Récolté</option>
                    <option value="QUARANTAINE">Quarantaine</option>
                    <option value="INACTIF">Inactif</option>
                </select>
            </div>

            <div class="filter-group">
                <label class="filter-label" for="filter-surface-min">Surface min (m²)</label>
                <input type="number" id="filter-surface-min" class="filter-input" style="width: 110px;" min="0" />
            </div>

            <div class="filter-group">
                <label class="filter-label" for="filter-surface-max">Surface max (m²)</label>
                <input type="number" id="filter-surface-max" class="filter-input" style="width: 110px;" min="0" />
            </div>

            <button type="button" id="btn-reset-filters" class="btn-mg btn-mg-secondary btn-reset-filters">
                <i class="bi bi-x-circle"></i> Réinitialiser
            </button>
        </div>

        <div id="row-count"></div>

        <div class="table-container">
            <table id="table-bassins" class="mg-table">
                <thead>
                    <tr>
                        <th class="sortable sort-asc" data-sort-key="code" data-sort-type="text">
                            Code Bassin <i class="bi sort-icon"></i>
                        </th>
                        <th class="sortable" data-sort-key="surface" data-sort-type="number">
                            Surface <i class="bi sort-icon"></i>
                        </th>
                        <th class="sortable" data-sort-key="profondeur" data-sort-type="number">
                            Profondeur <i class="bi sort-icon"></i>
                        </th>
                        <th class="sortable" data-sort-key="statut" data-sort-type="text">
                            Statut actuel <i class="bi sort-icon"></i>
                        </th>
                        <th style="text-align: right;">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="bassin : ${bassins}"
                        th:attr="data-code=${bassin.code},
                                 data-surface=${bassin.surfaceM2},
                                 data-profondeur=${bassin.profondeurMetre},
                                 data-statut=${bassin.statutActuel.code}">
                        <td style="font-weight: 700; color: var(--mg-primary);" th:text="${bassin.code}"></td>
                        <td th:text="${bassin.surfaceM2 + ' m²'}"></td>
                        <td th:text="${bassin.profondeurMetre + ' m'}"></td>
                        <td>
                            <span class="status-badge"
                                th:classappend="${bassin.statutActuel.code == 'ACTIF'} ? 'badge-actif' :
                                    (${bassin.statutActuel.code == 'PREPARATION'} ? 'badge-preparation' :
                                    (${bassin.statutActuel.code == 'EN_TRAITEMENT'} ? 'badge-traitement' :
                                    (${bassin.statutActuel.code == 'QUARANTAINE'} ? 'badge-quarantaine' :
                                    (${bassin.statutActuel.code == 'RECOLTE'} ? 'badge-recolte' :
                                    (${bassin.statutActuel.code == 'INACTIF'} ? 'badge-inactif' : 'badge-vide')))))"
                                th:text="${bassin.statutActuel.libelle}"></span>
                        </td>
                        <td>
                            <div class="row-actions" style="justify-content: flex-end;">
                                <a th:href="@{/bassins/{id}(id=${bassin.id})}" class="row-link">
                                    <i class="bi bi-eye"></i> Voir
                                </a>
                                <a th:href="@{/bassins/{id}/modifier(id=${bassin.id})}" class="row-link" sec:authorize="hasRole('ADMIN')">
                                    <i class="bi bi-pencil"></i> Modifier
                                </a>
                                <form th:action="@{/bassins/{id}/supprimer(id=${bassin.id})}" method="post"
                                    sec:authorize="hasRole('ADMIN')"
                                    style="display:inline"
                                    onsubmit="return confirm('Voulez-vous vraiment supprimer ce bassin ?');">
                                    <button type="submit" class="btn-mg btn-mg-danger">
                                        <i class="bi bi-trash"></i> Supprimer
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>

                    <tr th:if="${#lists.isEmpty(bassins)}" id="row-empty-server">
                        <td colspan="5" style="text-align: center; color: var(--mg-text-muted); padding: 40px;">
                            Aucun bassin enregistré pour le moment.
                        </td>
                    </tr>
                </tbody>
            </table>
            <div id="row-empty-filtered" style="display:none; text-align: center; color: var(--mg-text-muted); padding: 40px;">
                Aucun bassin ne correspond aux critères de recherche.
            </div>
        </div>

    </div>

    <th:block layout:fragment="page-scripts">
        <script th:src="@{/js/bassin/liste-filtres.js}"></script>
    </th:block>
</body>

</html>
