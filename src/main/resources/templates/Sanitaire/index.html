<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
    layout:decorate="~{layouts/default}">

<head>
    <title layout:fragment="page-title">OROSE — Dashboard Sanitaire</title>
    <th:block layout:fragment="page-styles">
        <link href="/css/common/import-modal.css" rel="stylesheet" />
        <style>
            .header-section {
                margin-bottom: 32px;
                padding-bottom: 16px;
                border-bottom: 1px solid #e2e8f0;
            }

            .header-title {
                font-size: 26px;
                font-weight: 700;
                margin-bottom: 8px;
                color: var(--mg-primary);
            }

            .header-sub {
                font-size: 14px;
                color: var(--mg-text-muted);
                line-height: 1.5;
            }

            .card {
                background: var(--mg-surface-bright);
                border: 1px solid var(--mg-outline);
                border-radius: var(--radius);
                padding: 24px;
                margin-bottom: 24px;
            }

            .btn {
                padding: 10px 20px;
                border-radius: var(--radius);
                font-size: 13px;
                font-weight: 600;
                cursor: pointer;
                transition: 0.2s;
                border: 1px solid transparent;
                display: inline-flex;
                align-items: center;
                gap: 8px;
                text-decoration: none;
                justify-content: center;
            }

            .btn-primary {
                background: var(--mg-primary);
                color: white;
            }

            .btn-primary:hover {
                opacity: 0.9;
            }

            .btn-outline {
                background: transparent;
                border-color: var(--mg-outline);
                color: var(--mg-primary);
            }

            .btn-outline:hover {
                background: var(--mg-surface);
            }

            .form-group {
                margin-bottom: 16px;
                display: flex;
                flex-direction: column;
                gap: 8px;
            }

            .form-control {
                font-family: var(--font-main);
                font-size: 14px;
                padding: 10px 12px;
                border: 1px solid var(--mg-outline);
                border-radius: var(--radius);
                background: white;
                color: var(--mg-primary);
                outline: none;
                transition: 0.2s;
            }

            .form-control:focus {
                border-color: var(--mg-primary);
            }

            .table-container {
                width: 100%;
                overflow-x: auto;
            }

            table {
                width: 100%;
                border-collapse: collapse;
                text-align: left;
            }

            thead th {
                background: var(--mg-surface);
                padding: 12px 16px;
                font-size: 11px;
                font-weight: 700;
                text-transform: uppercase;
                color: var(--mg-secondary);
                border-bottom: 1px solid var(--mg-outline);
                letter-spacing: 0.05em;
            }

            tbody td {
                padding: 14px 16px;
                border-bottom: 1px solid var(--mg-outline);
                font-size: 13px;
            }

            tbody tr:hover td {
                background: var(--mg-surface);
            }

            .badge {
                padding: 2px 8px;
                border-radius: 20px;
                font-size: 11px;
                font-weight: 700;
                display: inline-block;
                text-transform: uppercase;
            }

            .badge-success { background: #dcfce7; color: #166534; }
            .badge-warning { background: #fef3c7; color: #92400e; }
            .badge-danger { background: #fee2e2; color: #991b1b; }
            .badge-neutral { background: #f3f4f6; color: #4b5563; }

            .icon-btn {
                background: transparent;
                border: none;
                cursor: pointer;
                width: 32px;
                height: 32px;
                border-radius: var(--radius);
                display: inline-flex;
                align-items: center;
                justify-content: center;
                color: var(--mg-secondary);
                transition: background 0.2s;
                text-decoration: none;
            }

            .icon-btn:hover {
                background: var(--mg-surface-container);
            }

            .resolve-btn {
                background: #166534;
                border: none;
                color: #ffffff;
                cursor: pointer;
                border-radius: 999px;
                padding: 10px 14px;
                font-size: 12px;
                font-weight: 700;
                letter-spacing: 0.02em;
                display: inline-flex;
                align-items: center;
                gap: 8px;
                box-shadow: 0 8px 18px rgba(22, 101, 52, 0.18);
                transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
            }

            .resolve-btn:hover {
                background: #14532d;
                transform: translateY(-1px);
                box-shadow: 0 10px 22px rgba(22, 101, 52, 0.24);
            }

            .resolve-btn:focus-visible {
                outline: 3px solid rgba(22, 101, 52, 0.28);
                outline-offset: 2px;
            }

            .resolve-complete {
                display: inline-flex;
                align-items: center;
                gap: 6px;
                color: #166534;
                font-size: 12px;
                font-weight: 700;
                text-transform: uppercase;
                letter-spacing: 0.04em;
            }

            @media (max-width: 992px) {
                .table-container { overflow-x: auto; }
            }
        </style>
    </th:block>
</head>

<body>

    <div layout:fragment="content">
        <header class="header-section">
            <h2 class="header-title">Registre des Incidents</h2>
            <p class="header-sub">Liste des anomalies et alertes sanitaires en cours ou résolues.</p>
        </header>

        <div th:if="${message}" class="badge badge-success" style="display:block; padding:12px 16px; margin-bottom:16px; font-size:13px; text-transform:none;">
            <span th:text="${message}"></span>
        </div>
        <div th:if="${errorMessage}" class="badge badge-danger" style="display:block; padding:12px 16px; margin-bottom:16px; font-size:13px; text-transform:none;">
            <span th:text="${errorMessage}"></span>
        </div>

        <div th:replace="~{fragments/import-modal :: modal('import-incidents', 'Incidents sanitaires', @{/sanitaire/index/import}, 'idCycleBassinAssoc, dateDetection (AAAA-MM-JJ), typeIncident, niveauGravite (FAIBLE/MODERE/CRITIQUE), description (optionnel), idResponsable')}"></div>

        <div class="card" style="margin-bottom: 24px;">
            <div style="display: flex; gap: 12px; align-items: center; flex-wrap: wrap;">
                <div class="form-group" style="flex: 1; min-width: 200px; margin-bottom: 0;">
                    <input class="form-control" data-list-filter="#table-incidents" data-filter-param="q" placeholder="Rechercher un incident..." type="text" />
                </div>
                <a data-export-link class="btn btn-outline" th:href="@{/sanitaire/index/export(format='excel')}"><i class="bi bi-file-earmark-excel"></i> Excel</a>
                <a data-export-link class="btn btn-outline" th:href="@{/sanitaire/index/export(format='pdf')}"><i class="bi bi-file-earmark-pdf"></i> PDF</a>
                <a data-export-link class="btn btn-outline" th:href="@{/sanitaire/index/export(format='csv')}"><i class="bi bi-filetype-csv"></i> CSV</a>
                <button type="button" class="btn btn-outline" onclick="ouvrirModalImport('import-incidents')" sec:authorize="hasAnyRole('ADMIN','TECH','RS')">
                    <i class="bi bi-upload"></i> Importer
                </button>
                <button class="btn btn-primary" onclick="window.location.href='/sanitaire/declaration'"
                        sec:authorize="hasAnyRole('ADMIN','TECH','RS')">
                    <i class="bi bi-plus-circle"></i> NOUVEL INCIDENT
                </button>
            </div>
        </div>

        <div class="card" style="padding: 0;">
            <div class="table-container">
                <table id="table-incidents" class="filtre-tab" style="width: 100%;">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Bassin</th>
                            <th>Type</th>
                            <th>Gravité</th>
                            <th>Description</th>
                            <th>Responsable</th>
                            <th>Statut</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="incident : ${incidents}">
                            <td  th:data-order="${incident.dateDetection}" th:text="${#temporals.format(incident.dateDetection, 'dd/MM/yyyy')}">--</td>
                            <td><strong th:data-order="${incident.cycleBassinAssoc.bassin.code}" th:text="${incident.cycleBassinAssoc.bassin.code}">--</strong></td>
                            <td th:data-order="${incident.typeIncident}" th:text="${incident.typeIncident}">--</td>
                            <td>
                                <span th:if="${incident.niveauGravite == 'CRITIQUE'}" class="badge badge-danger">Critique</span>
                                <span th:if="${incident.niveauGravite == 'MODERE'}" class="badge badge-warning">Modéré</span>
                                <span th:if="${incident.niveauGravite == 'FAIBLE'}" class="badge badge-neutral">Faible</span>
                            </td>
                            <td th:data-order="${incident.description}" th:text="${#strings.abbreviate(incident.description, 50)}">--</td>
                            <td th:data-order="${incident.responsable.nom} + ' ' + ${incident.responsable.prenom}" th:text="${incident.responsable.nom} + ' ' + ${incident.responsable.prenom}">--</td>
                            <td>
                                <span th:if="${!incident.estResolu}" class="badge badge-neutral">En cours</span>
                                <span th:if="${incident.estResolu}" class="badge badge-success">Résolu</span>
                            </td>
                            <td>
                                <form th:if="${!incident.estResolu}" th:action="@{/sanitaire/resoudre/{id}(id=${incident.id})}" method="post" style="display:inline;" onsubmit="return confirm('Êtes-vous sûr?')">
                                    <button type="submit" class="resolve-btn" title="Résoudre l'incident">
                                        <i class="bi bi-check2-circle"></i>
                                        <span>Résoudre</span>
                                    </button>
                                </form>
                                <span th:if="${incident.estResolu}" class="resolve-complete">
                                    <i class="bi bi-check-circle-fill"></i>
                                    <span>Résolu</span>
                                </span>
                            </td>
                        </tr>
                        <tr th:if="${incidents.isEmpty()}">
                            <td colspan="8" style="text-align: center; padding: 40px;">Aucun incident enregistré</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <th:block layout:fragment="page-scripts">
        <script th:src="@{/js/list-filter.js}"></script>
        <script th:src="@{/js/common/import-modal.js}"></script>
        <script th:src="@{/js/common/export-filters.js}"></script>
    </th:block>

</body>
</html>
