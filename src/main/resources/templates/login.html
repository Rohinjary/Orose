<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Move Gasy — Connexion</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/login.css}">
    <link rel="stylesheet" th:href="@{/css/responsive.css}">
</head>

<body>
    <div class="login-card">
        <div class="brand-header">
            <div class="brand-logo"><i class="bi bi-water"></i></div>
            <span class="brand-name">MOVE GASY</span>
            <span class="brand-sub">Administration &amp; Sécurité</span>
        </div>

        <div class="alert-error" th:if="${param.error}">
            Identifiants invalides. Veuillez réessayer.
        </div>
        <div class="alert alert-success" th:if="${param.logout}"
            style="background:#dcfce7;color:#166534;padding:10px;border-radius:4px;margin-bottom:16px;">
            Vous avez été déconnecté avec succès.
        </div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label class="form-label" for="email">Email Professionnel</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="nom@movegasy.mg" required
                    autofocus />
            </div>
            <div class="mb-4">
                <label class="form-label" for="password">Mot de passe</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="••••••••"
                    required />
            </div>
            <button type="submit" class="btn btn-primary w-100">SE CONNECTER</button>
        </form>
    </div>
</body>

</html>
